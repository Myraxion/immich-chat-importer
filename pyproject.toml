[project]
name = "immich-chat-importer"
version = "0.1.5"
description = "Self-hosted bot that imports media from Telegram and Discord into Immich."
readme = "README.md"

requires-python = ">=3.12"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "myraxion" }]
keywords = ["immich", "telegram", "discord", "bot", "self-hosted", "photos"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Operating System :: POSIX :: Linux",
    "Topic :: Communications :: Chat",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "aiogram>=3.4,<4",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.7",
    "Pillow>=10.2",
    "tzdata",
    "discord-py>=2.4,<3",
]


[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "mypy>=1.9",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.urls]
Homepage = "https://github.com/myraxion/immich-chat-importer"
Issues = "https://github.com/myraxion/immich-chat-importer/issues"

[project.scripts]
immich-chat-importer = "immich_tg_bot.__main__:main"
immich-telegram-bot = "immich_tg_bot.__main__:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "ASYNC"]
# ASYNC240: We make occasional pathlib calls inside async handlers
# (mkdir, exists, stat). For a single-user Telegram bot they run on local
# filesystem in microseconds and don't warrant the noise of asyncio.to_thread
# wrappers. Revisit if/when we add high-concurrency workloads.
ignore = ["ASYNC240"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]

