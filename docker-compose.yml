services:
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    container_name: telegram-bot-api
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_LOCAL: "1"
      TZ: ${TZ:-UTC}
    volumes:
      - tg-files:/var/lib/telegram-bot-api

  immich-telegram-bot:
    image: ghcr.io/myraxion/immich-telegram-bot:latest
    container_name: immich-telegram-bot
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: ${TZ:-UTC}
    depends_on:
      - telegram-bot-api
    volumes:
      - tg-files:/var/lib/telegram-bot-api
      - ./data:/data

volumes:
  tg-files:
